# Headers de seguranca num snippet: add_header dentro de location anula os do server.
map $uri $static_cache {
    default                    "no-cache";
    ~*\.(?:js|css|woff2?)$     "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api-vps.fabrodiego.com; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    # Arquivos com hash no nome: cache longo; index.html e o resto sempre revalidam.
    add_header Cache-Control $static_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
