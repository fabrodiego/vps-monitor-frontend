name: build-e-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: read
  packages: write
env:
  IMAGEM: ghcr.io/fabrodiego/vps-monitor-frontend
  NAMESPACE: vps-monitor-frontend
  DEPLOYMENT: vps-monitor-frontend
jobs:
  build-e-deploy:
    runs-on: [self-hosted, vps-monitor-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t $IMAGEM:latest -t $IMAGEM:${{ github.sha }} .
          docker push --all-tags $IMAGEM
      - uses: azure/setup-kubectl@v4
      - run: |
          kubectl -n $NAMESPACE rollout restart deployment/$DEPLOYMENT
          kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=300s
